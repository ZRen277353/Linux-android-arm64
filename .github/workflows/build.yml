name: Build lsdriver (Manual Version Selection)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '选择要编译的 GKI 内核版本'
        required: true
        default: '6.1'
        type: choice
        options:
          - '5.10'
          - '5.15'
          - '6.1'
          - '6.5'
          - '6.12'

jobs:
  build:
    name: Build Driver for GKI ${{ inputs.kernel_version }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Update Submodules
        run: |
          git submodule update --init --remote --recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc libssl-dev \
               libelf-dev python3 git wget curl zip unzip clang lld \
               gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Download GKI Kernel Headers & Create Directories
        run: |
          echo "拉取 Google 官方 GKI 源码..."
          # 替换为谷歌官方的 ACK 仓库，拉取 android14-6.1 分支
          git clone --depth 1 -b android14-6.1 https://android.googlesource.com/kernel/common.git gki_headers
          
          # 根据构建脚本的硬编码检测逻辑，创建对应的软链接目录进行欺骗
          ln -s $(pwd)/gki_headers $(pwd)/6.12-Android16
          ln -s $(pwd)/gki_headers $(pwd)/6.6-Android15
          ln -s $(pwd)/gki_headers $(pwd)/6.1-Android14
          ln -s $(pwd)/gki_headers $(pwd)/5.15-Android13
          ln -s $(pwd)/gki_headers $(pwd)/5.10-Android13
          ln -s $(pwd)/gki_headers $(pwd)/5.10-Android12
          
          echo "软链接映射完成，当前工作区目录结构："
          ls -la

      - name: Fix Hardcoded Paths
        run: |
          chmod +x build_all.sh
          if [ -f "ddk_build_all.sh" ]; then chmod +x ddk_build_all.sh; fi
          
          # 替换脚本中写死的原作者本地绝对路径
          sed -i "s|/mnt/e/1.CodeRepository/Android/Kernel/lsdriver|$(pwd)/lsdriver|g" build_all.sh
          if [ -f "ddk_build_all.sh" ]; then
            sed -i "s|/mnt/e/1.CodeRepository/Android/Kernel/lsdriver|$(pwd)/lsdriver|g" ddk_build_all.sh
          fi

      - name: Execute Build Script
        run: |
          echo "开始为 GKI 编译..."
          # 通过管道输入 'n' 跳过交互式询问，避免 CI 卡死
          echo "n" | ./build_all.sh

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ inputs.kernel_version }}-build-outputs
          path: |
            **/*.ko
            **/*.o
            **/lsdriver*
            out/
            payload_*.ko
            install_driver.sh
          retention-days: 7
