name: Build lsdriver (Manual Version Selection)

# 仅保留 workflow_dispatch，删除 push 和 pull_request，彻底关闭自动触发
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '选择要编译的 GKI 内核版本'
        required: true
        default: '6.1'
        type: choice
        options:
          - '5.10'
          - '5.15'
          - '6.1'
          - '6.5'
          - '6.12'

jobs:
  build:
    name: Build Driver for GKI ${{ inputs.kernel_version }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Update Submodules
        run: |
          git submodule update --init --remote --recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc libssl-dev \
               libelf-dev python3 git wget curl zip unzip clang lld \
               gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Prepare Kernel Headers for ${{ inputs.kernel_version }}
        run: |
          echo "用户选择的内核版本为: ${{ inputs.kernel_version }}"
          # 【重要提示】: 此处需要根据选择的版本，动态拉取对应的内核源码或头文件。
          # 不同的项目或构建环境有不同的拉取方式，通常通过环境变量传递给脚本：
          # export KERNEL_DIR=$(pwd)/kernel_workspace_${{ inputs.kernel_version }}
          
      - name: Fix Hardcoded Paths
        run: |
          chmod +x build_all.sh
          if [ -f "ddk_build_all.sh" ]; then chmod +x ddk_build_all.sh; fi
          
          # 替换写死的绝对路径为当前动态路径
          sed -i "s|/mnt/e/1.CodeRepository/Android/Kernel/lsdriver|$(pwd)/lsdriver|g" build_all.sh
          if [ -f "ddk_build_all.sh" ]; then
            sed -i "s|/mnt/e/1.CodeRepository/Android/Kernel/lsdriver|$(pwd)/lsdriver|g" ddk_build_all.sh
          fi

      - name: Execute Build Script
        run: |
          echo "开始为 GKI ${{ inputs.kernel_version }} 进行编译..."
          # 您可以根据脚本特性，选择向脚本中传入环境变量来控制内核版本
          # 例如: export KERNEL_VERSION=${{ inputs.kernel_version }}
          echo "n" | ./build_all.sh

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 动态命名输出的压缩包，防止不同版本的文件混淆
          name: lsdriver-${{ inputs.kernel_version }}-build-outputs
          path: |
            **/*.ko
            **/*.o
            **/lsdriver*
            out/
          retention-days: 7
