name: Build lsdriver (GKI & Standard)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许在 Actions 页面手动触发编译

jobs:
  build:
    name: Build Kernel Driver
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 必须开启递归克隆，拉取 Capstone, ImGui, json, thread_pool 等子模块
          submodules: 'recursive'
          fetch-depth: 1

      - name: Update Submodules
        run: |
          # 确保所有子模块同步到官方最新指定分支 (如 next, master, develop)
          git submodule update --init --remote --recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          # 安装内核编译与交叉编译常见依赖
          sudo apt-get install -y build-essential bison flex bc libssl-dev \
               libelf-dev python3 git wget curl zip unzip clang lld \
               gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download GKI 6.1 Kernel Headers (Optional)
        # 如果 ddk_build_all.sh 需要依赖外部内核源码树，可以在此下载 GKI 源码或头文件
        # 视脚本的具体实现，这里提供一个下载通用 GKI 源码的占位符
        run: |
          echo "Setting up kernel source directory if needed..."
          # wget https://dl.google.com/android/gki/gki-kernel-6.1-xxx.tar.gz
          # tar -xzf gki-kernel-6.1-xxx.tar.gz -C /tmp/kernel_src
          # echo "KERNEL_DIR=/tmp/kernel_src" >> $GITHUB_ENV

      - name: Execute Standard Build (build_all.sh)
        run: |
          echo "Starting standard build..."
          chmod +x build_all.sh
          # 如果脚本需要特定的环境变量，可以在这里注入
          ./build_all.sh

      - name: Execute DDK Build (ddk_build_all.sh)
        run: |
          # DDK 编译通常用于 GKI 模块适配
          if [ -f "ddk_build_all.sh" ]; then
            echo "Starting DDK build for GKI..."
            chmod +x ddk_build_all.sh
            ./ddk_build_all.sh
          else
            echo "ddk_build_all.sh not found, skipping."
          fi

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-build-outputs
          # 收集编译生成的内核模块 (.ko) 和测试用的用户态程序
          path: |
            **/*.ko
            **/*.o
            **/lsdriver*
          retention-days: 7
