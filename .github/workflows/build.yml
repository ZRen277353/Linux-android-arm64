name: Build lsdriver (Manual Version Selection)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '选择要编译的 GKI 内核版本'
        required: true
        default: '6.1'
        type: choice
        options:
          - '5.10'
          - '5.15'
          - '6.1'
          - '6.5'
          - '6.12'

jobs:
  build:
    name: Build Driver and Server for GKI ${{ inputs.kernel_version }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Update Submodules
        run: |
          git submodule update --init --remote --recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc libssl-dev \
               libelf-dev python3 git wget curl zip unzip clang lld \
               gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c # 提供编译用户态代理程序所需的 NDK

      - name: Download & Prepare GKI Kernel Environment
        run: |
          echo "拉取 Google 官方 GKI 源码..."
          git clone --depth 1 -b android14-6.1 https://android.googlesource.com/kernel/common.git gki_headers
          
          echo "初始化内核编译环境 (生成 .config 与核心 scripts)..."
          cd gki_headers
          # GKI 6.1 强制要求使用 LLVM 工具链编译
          make ARCH=arm64 LLVM=1 gki_defconfig
          make ARCH=arm64 LLVM=1 modules_prepare
          cd ..
          
          echo "建立目录映射，骗过原脚本的绝对路径检测..."
          ln -s $(pwd)/gki_headers $(pwd)/6.12-Android16
          ln -s $(pwd)/gki_headers $(pwd)/6.6-Android15
          ln -s $(pwd)/gki_headers $(pwd)/6.1-Android14
          ln -s $(pwd)/gki_headers $(pwd)/5.15-Android13
          ln -s $(pwd)/gki_headers $(pwd)/5.10-Android13
          ln -s $(pwd)/gki_headers $(pwd)/5.10-Android12

      - name: Fix Hardcoded Paths in Scripts
        run: |
          chmod +x build_all.sh
          if [ -f "ddk_build_all.sh" ]; then chmod +x ddk_build_all.sh; fi
          
          # 将作者电脑的绝对路径替换为 GitHub 运行时的当前工作路径
          sed -i "s|/mnt/e/1.CodeRepository/Android/Kernel/lsdriver|$(pwd)/lsdriver|g" build_all.sh
          if [ -f "ddk_build_all.sh" ]; then
            sed -i "s|/mnt/e/1.CodeRepository/Android/Kernel/lsdriver|$(pwd)/lsdriver|g" ddk_build_all.sh
          fi

      - name: Execute Build Script (Kernel Driver .ko)
        run: |
          echo "开始编译底层内核驱动..."
          # 通过管道自动输入 'n' (不剥离符号)，防止卡死
          echo "n" | ./build_all.sh

      - name: Build Android User-space Server
        run: |
          echo "开始手动编译 Android 桥接服务端..."
          # 针对包含 jni 目录的传统 NDK 结构进行强制编译
          if [ -d "android/jni" ] || [ -d "android" ]; then
            cd android
            ndk-build || echo "NDK 编译可能需要不同的参数配置，请检查日志"
            cd ..
          else
            echo "未检测到 android 目录，跳过服务端编译。"
          fi

      - name: Upload Driver and Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsdriver-${{ inputs.kernel_version }}-build-outputs
          # 扩大收集范围，确保把所有可能的生成物（尤其是 android/libs 下的服务端）打包带走
          path: |
            **/*.ko
            **/lsdriver*
            out/
            android/libs/
            android/obj/
            payload_*.ko
            install_driver.sh
          retention-days: 7
